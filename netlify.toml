[build]
  base = "."
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/hsupport"
  to = "/Support-Zhuddle-and-Outnumbered.pdf"
  status = 302
